    <script src="script.js"></script>
    <script type="module">
        import * as pdfjsLib from
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.min.mjs';

        pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.worker.min.mjs';

        const pdf = await pdfjsLib.getDocument("./assets/One-Punch Man Chapter 101.pdf").promise;
    
        var pageNumber = 1;
        var loadingTask = pdfjsLib.getDocument("./assets/One-Punch Man Chapter 101.pdf");
        function render(){
            loadingTask.promise.then(function(pdf) {
                console.log('PDF loaded');
    
                // Fetch the first page
                //  if(pageNumber >0 ){
                   
                // }
                pdf.getPage(pageNumber).then(function(page) {
                console.log('Page loaded');
    
                var scale = 1;
                var viewport = page.getViewport({scale: scale});
    
                // Prepare canvas using PDF page dimensions
                var canvas = document.getElementById('the-canvas');
                var context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
    
                // Render PDF page into canvas context
                var renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                var renderTask = page.render(renderContext);
                renderTask.promise.then(function () {
                    console.log('Page rendered');
                });
                });
            }, function (reason) {
                // PDF loading error
                console.error(reason);
            });
        }
        render();

        let timeout;
        document.getElementById("nextbutton").addEventListener("click",function() {
            if (timeout) clearTimeout(timeout);
          timeout = setTimeout(() => {
                if(pageNumber < pdf.numPages){
                    pageNumber = pageNumber + 1;
                    console.log(pageNumber);
                    render();
                }
            },200);
        });
        document.getElementById("backbutton").addEventListener("click",function() {
            if(pageNumber > 1){
                pageNumber = pageNumber - 1;
            }
            console.log(pageNumber);
            render();
        });

        document.getElementById("wallpaper1").addEventListener("click", function() {
            document.getElementById("bg").style.cssText = "background-image: url(./assets/homunuculus.jpg); background-size: cover;background-repeat: no-repeat;";
            console.log("changed");
        });
        document.getElementById("wallpaper2").addEventListener("click", function() {
            document.getElementById("bg").style.cssText = "background-image: url(./assets/wallhaven-og2zzl.jpg); background-size: cover;background-repeat: no-repeat;";
            console.log("changed");
        });
        document.getElementById("wallpaper3").addEventListener("click", function() {
            document.getElementById("bg").style.cssText = "background-image: url(./assets/wallhaven-jevmdp.jpg); background-size: cover;background-repeat: no-repeat;";
            console.log("changed");
        });
        // function nextpage() {
        //     pageNumber = pageNumber + 1;
        //     console.log(pageNumber);
        //     render();
        // }
    </script>
